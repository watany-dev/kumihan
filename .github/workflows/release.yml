name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Compile and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release and upload binaries
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          # Publishing jobs must not restore a dependency cache.
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check
        run: vp check

      - name: Test
        run: vp test --coverage

      - name: Compile binaries
        run: vp run compile -- --all

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f dist-bin/SHA256SUMS.txt
          test -f dist-bin/kumihan-linux-x64
          notes="$(mktemp)"
          {
            printf 'kumihan %s のスタンドアロン実行ファイルです。Bun や Node.js のインストールは不要です。\n\n' "${TAG}"
            cat <<'EOF'
          ## ファイル

          | ファイル | 対象 |
          | --- | --- |
          | `kumihan-linux-x64` | Linux x64 |
          | `kumihan-linux-arm64` | Linux ARM64 |
          | `kumihan-darwin-x64` | macOS Intel |
          | `kumihan-darwin-arm64` | macOS Apple Silicon |
          | `kumihan-windows-x64.exe` | Windows x64 |
          | `SHA256SUMS.txt` | SHA-256 チェックサム |

          ## 使い方

          ```bash
          chmod +x kumihan-linux-x64
          ./kumihan-linux-x64 serve manuscript.md
          ./kumihan-linux-x64 export manuscript.md --out dist
          ```

          macOS で隔離属性が付く場合:

          ```bash
          xattr -d com.apple.quarantine kumihan-darwin-arm64
          chmod +x kumihan-darwin-arm64
          ```
          EOF
          } > "${notes}"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${notes}" \
            dist-bin/kumihan-linux-x64 \
            dist-bin/kumihan-linux-arm64 \
            dist-bin/kumihan-darwin-x64 \
            dist-bin/kumihan-darwin-arm64 \
            dist-bin/kumihan-windows-x64.exe \
            dist-bin/SHA256SUMS.txt

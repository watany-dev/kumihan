name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout the repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Export
        run: vp run export

  workflow-audit:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout the repository
      actions: read # zizmor online audits of used GitHub Actions
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -o "${asset}" "${base_url}/${asset}"
          echo "${ACTIONLINT_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version
          shellcheck --version | head -n 1

      - name: Run actionlint
        run: actionlint -color

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          min-severity: low
          persona: pedantic
          version: '1.29.0'
